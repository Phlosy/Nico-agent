name: Feature request
description: Propose a user-facing capability or improvement
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Explain the behavior and acceptance criteria.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - API and control plane
        - Runtime adapter
        - Tool Gateway or sandbox
        - Memory or Skill governance
        - Console
        - Deployment and operations
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked the README support matrix and Roadmap.
          required: true
        - label: I searched existing Issues for a related request.
          required: true
