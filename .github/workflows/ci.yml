name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run backend unit tests and frontend build
        run: scripts/test.sh

      - name: Lint public Markdown
        run: >-
          npx --yes markdownlint-cli2@0.22.1
          README.md backend/README.md CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md
          docs/api.md docs/architecture.md docs/configuration.md
          docs/domain-model.md docs/getting-started.md docs/memory-and-skill.md
          docs/repository-assessment.md docs/roadmap.md docs/runtime.md
          docs/security.md docs/state-machines.md docs/testing.md
          docs/tool-gateway.md docs/troubleshooting.md
          .github/pull_request_template.md
