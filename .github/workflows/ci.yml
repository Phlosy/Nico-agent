name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend, frontend, and installer contracts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Go for workflow linting
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"

      - name: Run backend and frontend tests
        run: scripts/test.sh

      - name: Run installer and release contract tests
        run: scripts/test-install.sh

      - name: Run deterministic Provider onboarding
        run: scripts/e2e-provider-onboarding.sh

      - name: Run offline Web search and fetch acceptance
        run: scripts/e2e-web-tools.sh

      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Lint public Markdown
        run: >-
          npx --yes markdownlint-cli2@0.22.1
          README.md backend/README.md CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md
          docs/api.md docs/architecture.md docs/configuration.md
          docs/cli.md docs/domain-model.md docs/getting-started.md docs/installation.md
          docs/memory-and-skill.md docs/repository-assessment.md docs/roadmap.md
          docs/runtime.md docs/security.md docs/state-machines.md docs/testing.md
          docs/tool-gateway.md docs/troubleshooting.md
          .github/pull_request_template.md
