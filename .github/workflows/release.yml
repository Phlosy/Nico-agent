name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: Reuse the main test gate
    uses: ./.github/workflows/ci.yml

  validate:
    name: Validate release version
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate Tag against package metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: scripts/package-release.sh --tag "$RELEASE_TAG" --validate-only

  images:
    name: Publish ${{ matrix.name }} image
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            image: ghcr.io/phlosy/nico-agent-backend
          - name: hermes
            context: ./backend
            dockerfile: ./backend/Dockerfile.hermes
            image: ghcr.io/phlosy/nico-agent-hermes
          - name: web
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            image: ghcr.io/phlosy/nico-agent-web
    steps:
      - name: Check out tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ matrix.image }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release:
    name: Create GitHub Release
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build CLI wheel
        run: python -m pip wheel --no-deps --wheel-dir dist/wheels ./backend

      - name: Assemble verified Release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          wheel="$(find dist/wheels -maxdepth 1 -type f -name '*.whl' -print -quit)"
          scripts/package-release.sh --tag "$RELEASE_TAG" --wheel "$wheel" --output dist/release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          assets=(
            dist/release/install.sh
            dist/release/nico-agent-bundle.tar.gz
            dist/release/version.txt
            dist/release/SHA256SUMS
          )
          gh release create "$RELEASE_TAG" "${assets[@]}" --generate-notes --verify-tag
