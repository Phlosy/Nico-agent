name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate Tag against package metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: scripts/package-release.sh --tag "$RELEASE_TAG" --validate-only

      - name: Validate annotated Tag and main ancestry
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"

  test:
    name: Reuse the main test gate
    needs: validate
    uses: ./.github/workflows/ci.yml

  assets:
    name: Build CLI and installation assets
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build CLI wheel
        run: python -m pip wheel --no-deps --wheel-dir dist/wheels ./backend

      - name: Install and exercise the built CLI wheel
        run: |
          wheel="$(find dist/wheels -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          python -m venv "$RUNNER_TEMP/nico-wheel-smoke"
          "$RUNNER_TEMP/nico-wheel-smoke/bin/pip" install "$wheel"
          "$RUNNER_TEMP/nico-wheel-smoke/bin/nico" --version
          "$RUNNER_TEMP/nico-wheel-smoke/bin/python" -c \
            'import importlib.metadata, nico_agent; importlib.metadata.version("nico-agent-platform")'

      - name: Assemble verified release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          wheel="$(find dist/wheels -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          scripts/package-release.sh --tag "$RELEASE_TAG" --wheel "$wheel" --output dist/release

      - name: Preserve release assets for publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nico-release-assets
          path: dist/release/
          if-no-files-found: error
          retention-days: 7

  images:
    name: Publish ${{ matrix.name }} image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            image: ghcr.io/phlosy/nico-agent-backend
          - name: hermes
            context: ./backend
            dockerfile: ./backend/Dockerfile.hermes
            image: ghcr.io/phlosy/nico-agent-hermes
          - name: web
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            image: ghcr.io/phlosy/nico-agent-web
    steps:
      - name: Check out tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and stage image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ matrix.image }}:staging-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Record immutable image reference
        env:
          IMAGE: ${{ matrix.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ${{ matrix.name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist/image-digests
          printf '%s:%s@%s\n' "$IMAGE" "$RELEASE_TAG" "$IMAGE_DIGEST" \
            > "dist/image-digests/$IMAGE_NAME.txt"

      - name: Preserve image digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nico-image-${{ matrix.name }}
          path: dist/image-digests/${{ matrix.name }}.txt
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: [assets, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download CLI and installation assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nico-release-assets
          path: dist/release

      - name: Download immutable image references
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: nico-image-*
          path: dist/image-digests
          merge-multiple: true

      - name: Finalize checksums and image manifest
        run: scripts/finalize-release.sh --assets dist/release --digests dist/image-digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: scripts/publish-release.sh --tag "$RELEASE_TAG" --assets dist/release
