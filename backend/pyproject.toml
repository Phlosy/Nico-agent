[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nico-agent-platform"
version = "0.2.0"
description = "General-purpose, growing multi-agent service platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.18.5",
  "asyncpg==0.31.0",
  "fastapi==0.139.2",
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "pydantic-settings==2.14.2",
  "redis==8.0.1",
  "sqlalchemy[asyncio]==2.0.51",
  "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.15.22",
]

[project.scripts]
nico-api = "nico_agent.main:run"
nico-worker = "nico_agent.worker:run"
nico-sandbox-runner = "nico_agent.sandbox.api:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
